name: 24/7 Cloud Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes to ensure free cloud instances (HF Spaces, Render, Koyeb) never sleep
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional override URL to ping immediately"
        required: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping User Cloud OpenList Instances
        env:
          INSTANCE_URLS: ${{ vars.INSTANCE_URLS || secrets.INSTANCE_URLS }}
          MANUAL_URL: ${{ github.event.inputs.target_url }}
        run: |
          TARGETS="${MANUAL_URL:-$INSTANCE_URLS}"
          if [ -z "$TARGETS" ]; then
            echo "No INSTANCE_URLS repository variable or secret configured yet."
            echo "Add your cloud OpenList URL (e.g. https://username-listcloud.hf.space) to Settings -> Variables -> Actions -> INSTANCE_URLS."
            exit 0
          fi

          for raw_url in $(echo "$TARGETS" | tr ',' ' '); do
            clean_url="${raw_url%/}"
            echo "Pinging ${clean_url}/ping ..."
            HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 25 -A "ListCloud-24x7-KeepAlive/1.0" "${clean_url}/ping" || echo "000")
            echo "Status for ${clean_url}: HTTP ${HTTP_STATUS}"
          done
